syntax = "proto3";

package danta.identity;

import "common.proto";

service Identity {
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc ValidateApiKey (ValidateApiKeyRequest) returns (ValidateApiKeyResponse);
  rpc CheckPermission (CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  AuthenticatedIdentity identity = 1;
  bool valid = 2;
}

message ValidateApiKeyRequest {
  string secret = 1;
  string correlationId = 2;
}

message ValidateApiKeyResponse {
  AuthenticatedIdentity identity = 1;
  bool valid = 2;
}

message CheckPermissionRequest {
  string userId = 1;
  string permission = 2;
  string tenantId = 3;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message GetUserRequest {
  string userId = 1;
  string tenantId = 2;
}

message GetUserResponse {
  string id = 1;
  string email = 2;
  string firstName = 3;
  string lastName = 4;
  string role = 5;
  string tenantId = 6;
  string practiceId = 7;
  string locationId = 8;
  string status = 9;
  bool found = 10;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string firstName = 3;
  string lastName = 4;
  string role = 5;
  string tenantId = 6;
  string practiceId = 7;
  string locationId = 8;
  string status = 9;
}

message CreateUserRequest {
  string email = 1;
  string passwordHash = 2;
  string firstName = 3;
  string lastName = 4;
  string tenantId = 5;
  string role = 6;
  string practiceId = 7;
  string locationId = 8;
}

message CreateUserResponse {
  UserResponse user = 1;
}
